name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start local Supabase
        run: DO_NOT_TRACK=1 npx supabase start
      - name: Configure local test environment
        run: npm run configure:local
      - name: Provision isolated test accounts
        run: npm run provision:local
      - name: Run complete verification
        run: npm run check:ci
      - name: Stop local Supabase
        if: always()
        run: DO_NOT_TRACK=1 npx supabase stop
